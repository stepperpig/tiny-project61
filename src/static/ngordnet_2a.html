<!DOCTYPE html>

<head>
    <!--<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>-->
    <script src="jquery.min.js"></script>
    <script src="d3.v7.min.js"></script>

</head>
<link rel="stylesheet" href="ngordnet.css">
<script src="ngordnet.js"></script>

<html>

<body>

    <div id="graph">
        <svg width="640" height="400" class="plot">
        </svg>
        <textarea class="textresult" id="textresult"></textarea>

    </div>

    <div id="top-controls">
        <div class="container l--page">
            <div class="btn-control">
                <button id="history">Go!</button>
            </div>
            <div class="control words">
                <label for="words">Words</label>
                <div class="input">
                    <input type="text" id="words"/>
                </div>
            </div>
            <div class="control start-year">
                <label for="start">Start Year</label>
                <div class="input">
                    <input type="text" id="start" value="2000"/>
                </div>
            </div>
            <div class="control end-year">
                <label for="end">End Year</label>
                <div class="input">
                    <input type="text" id="end" value="2020"/>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
